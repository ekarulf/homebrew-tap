name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      QCAT_TEST_ENCLAVE: 0
      QCAT_TEST_SE: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Homebrew
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            prefix=/home/linuxbrew/.linuxbrew
          else
            prefix=/opt/homebrew
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "$prefix/sbin" >> "$GITHUB_PATH"
      - name: Install this checkout
        run: |
          brew tap --custom-remote ekarulf/tap "$GITHUB_WORKSPACE"
          brew install --formula ekarulf/tap/qcat
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install --formula ekarulf/tap/keystone
          fi
      - name: Audit and test
        run: |
          brew audit --strict ekarulf/tap/qcat
          brew test ekarulf/tap/qcat
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew audit --strict ekarulf/tap/keystone
            brew test ekarulf/tap/keystone
          fi
      - name: Test qcat release source without hardware identities
        shell: bash
        run: |
          brew unpack --destdir="$RUNNER_TEMP/qcat-source" ekarulf/tap/qcat
          sources=("$RUNNER_TEMP/qcat-source"/qcat-*)
          test "${#sources[@]}" -eq 1
          cd "${sources[0]}"
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -timeout 10m ./...
          cd third_party/tailcat
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -timeout 10m ./...
