name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      QCAT_TEST_ENCLAVE: 0
      QCAT_TEST_SE: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Homebrew
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            prefix=/home/linuxbrew/.linuxbrew
          else
            prefix=/opt/homebrew
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "$prefix/sbin" >> "$GITHUB_PATH"
      - name: Install this checkout
        run: |
          brew tap --custom-remote ekarulf/tap "$GITHUB_WORKSPACE"
          brew install --formula ekarulf/tap/qcat
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install --formula ekarulf/tap/keystone
          fi
      - name: Audit and test
        run: |
          brew audit --strict ekarulf/tap/qcat
          brew test ekarulf/tap/qcat
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew audit --strict ekarulf/tap/keystone
            brew test ekarulf/tap/keystone
          fi
      - name: Verify installed release binaries
        shell: bash
        run: |
          test -z "$(brew deps --include-build ekarulf/tap/qcat)"
          mkdir -p "$RUNNER_TEMP/qcat-release"
          tar -xzf "$(brew --cache ekarulf/tap/qcat)" -C "$RUNNER_TEMP/qcat-release"
          packages=("$RUNNER_TEMP/qcat-release"/qcat-*)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          prefix="$(brew --prefix ekarulf/tap/qcat)"
          cmp "$package/qcat" "$prefix/bin/qcat"
          cmp "$package/BUILD_COMMIT" "$prefix/share/doc/qcat/BUILD_COMMIT"
          if [[ "$RUNNER_OS" == macOS ]]; then
            cmp "$package/qcat-se" "$prefix/libexec/qcat-se"
            codesign --verify --strict "$prefix/bin/qcat"
            codesign --verify --strict "$prefix/libexec/qcat-se"
          fi
